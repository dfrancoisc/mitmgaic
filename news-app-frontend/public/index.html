<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>News Intelligence</title>
		<meta name="description" content="AI-curated news on healthcare IT, AI and data platforms." />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M9 22V10h3l8 8.5V10h3v12h-3l-8-8.5V22z' fill='white'/></svg>" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="site-header">
			<div class="container header-inner">
				<div class="brand">
					<span class="brand-mark" aria-hidden="true">N</span>
					<div>
						<h1>News Intelligence</h1>
						<p class="subtitle">AI-curated news, scored for relevance</p>
					</div>
				</div>
				<div class="header-actions">
					<p class="refreshed" id="last-refreshed" aria-live="polite">Loading…</p>
					<button type="button" class="btn btn-primary" id="refresh-btn">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" /></svg>
						<span class="btn-label">Refresh</span>
					</button>
				</div>
			</div>
		</header>

		<main class="container">
			<form class="filters" id="filters" aria-label="Filter articles">
				<label class="field">
					<span>Topic</span>
					<select name="topic" id="topic">
						<option value="">All topics</option>
					</select>
				</label>
				<label class="field">
					<span>Minimum relevance</span>
					<select name="min_score" id="min-score">
						<option value="">Any score</option>
						<option value="5">5+</option>
						<option value="7">7+</option>
						<option value="8">8+</option>
						<option value="9">9+</option>
					</select>
				</label>
				<label class="field">
					<span>Show</span>
					<select name="limit" id="limit">
						<option value="10">10 articles</option>
						<option value="25">25 articles</option>
						<option value="50" selected>50 articles</option>
						<option value="100">100 articles</option>
					</select>
				</label>
				<p class="result-count" id="result-count" aria-live="polite"></p>
			</form>

			<div class="status" id="status" role="status" hidden></div>

			<div id="articles" aria-busy="true">
				<div class="skeleton-group">
					<div class="skeleton skeleton-heading"></div>
					<div class="grid">
						<div class="skeleton skeleton-card"></div>
						<div class="skeleton skeleton-card"></div>
						<div class="skeleton skeleton-card"></div>
					</div>
				</div>
			</div>
		</main>

		<footer class="container footer">
			Summaries and relevance scores are generated by Claude from web search results. Always check the original source.
		</footer>

		<template id="card-template">
			<article class="card">
				<div class="card-meta">
					<span class="badge"></span>
					<span class="source"></span>
					<span class="dot" aria-hidden="true">·</span>
					<time class="date"></time>
				</div>
				<h3 class="headline"><a target="_blank" rel="noopener noreferrer"></a></h3>
				<p class="summary"></p>
			</article>
		</template>

		<script src="app.js"></script>
	</body>
</html>
